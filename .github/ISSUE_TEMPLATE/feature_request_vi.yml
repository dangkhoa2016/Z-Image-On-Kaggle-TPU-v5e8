name: Đề xuất tính năng
description: Đề xuất một cải tiến có phạm vi rõ ràng cho dự án.
title: "[Feature][VI] "
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Mục tiêu
      description: Vấn đề user-facing nào cần được giải quyết?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Thay đổi đề xuất
      description: Mô tả implementation nhỏ nhất đáp ứng mục tiêu.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Kế hoạch validation
      description: Thay đổi nên được test hoặc chứng minh trên Kaggle TPU như thế nào?
