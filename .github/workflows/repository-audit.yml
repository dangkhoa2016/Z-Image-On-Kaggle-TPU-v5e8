name: Repository Audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run repository structure audit
        run: python scripts/repository_audit.py .

      - name: Verify required public release files
        run: |
          test -f README.md
          test -f README.vi.md
          test -f LICENSE
          test -f LICENSE-NOTES.md
          test -f LICENSE-NOTES.vi.md
          test -f CHANGELOG.md
          test -f CHANGELOG.vi.md
          test -f CITATION.cff
          test -f THIRD_PARTY_LICENSES/Z-IMAGE-APACHE-2.0.txt
          test -f docs/MODEL_LICENSE.md
          test -f docs/MODEL_LICENSE.vi.md
          test ! -d docs/superpowers

      - name: Validate machine-readable evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('evidence').rglob('*.json'):
              json.loads(p.read_text())
              print('json OK:', p)
          PY

      - name: Compile maintained Python
        run: python -m compileall -q chunked_zimage_attention.py run_with_kernel_env.py run_zimage_spmd.py scripts zimage_tpu

      - name: Run full CPU-safe test suite
        run: python -m pytest -q
