name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run full CPU-safe tests
        run: python -m pytest -q

      - name: Run repository audit
        run: python scripts/repository_audit.py .

      - name: Validate Python syntax
        run: python -m compileall -q chunked_zimage_attention.py run_with_kernel_env.py run_zimage_spmd.py scripts zimage_tpu

      - name: Validate evidence JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('evidence').rglob('*.json'):
              json.loads(p.read_text())
              print('json OK:', p)
          PY
